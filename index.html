function studentView_(a) {
  return {
    id: a.id, section: a.section, title: a.title, pages: a.pages, course: a.course, mode: a.mode,
    calculator: a.calculator, due: a.due,
    resources: a.mode === 'test' ? [] : (a.resources || []).map(function (r) { return { title: r.title, url: r.url, kind: r.kind || 'link', group: r.group || '' }; }),
    questions: a.questions.map(function (q) {
      return {
        id: q.id, label: q.label, group: q.group, prompt: q.prompt, figure: q.figure || null, table: q.table || null,
        note: q.note || '', start: q.start || '', fromPresentation: q.fromPresentation || '', hintCount: (q.hints || []).length,
        image: q.image ? { key: q.image.key, alt: q.image.alt || '' } : null, hasSolution: !!(q.solution && q.solution.length),
        search: a.mode === 'test' ? '' : (q.search || ('algebra 1 ' + (q.group || a.title || ''))),
        parts: q.parts.map(function (p) {
          var o = {};
          SAFE_PART_KEYS.forEach(function (k) { if (p[k] !== undefined) o[k] = p[k]; });
          if (p.type === 'graph' && p.mode === 'points') o.pointCount = p.answer.length;
          return o;
        })
      };
    })
  };
}

function attemptKey_(email, aid) { return email + '|' + aid; }

function newState_() {
  return { answers: {}, results: {}, checks: {}, hints: {}, attempted: {}, revealed: {},
    integrity: { leaves: 0, awayMs: 0, pastes: 0, copies: 0, fastCorrect: 0, lockouts: 0, opens: 0, solutions: 0 }, started: new Date().toISOString() };
}

function getAttempt_(email, aid) {
  var row = Db.findRow('Attempts', 'Key', attemptKey_(email, aid));
  if (!row) return null;
  var st = JSON.parse(row.State || '{}');
  st.revealed = st.revealed || {}; st.integrity = st.integrity || {}; st.integrity.solutions = st.integrity.solutions || 0;
  return { row: row._row, status: row.Status, state: st };
}

function putAttempt_(email, aid, status, state, row) {
  var rec = { Key: attemptKey_(email, aid), Email: email, Assignment: aid, Status: status, Updated: new Date(), State: JSON.stringify(state) };
  if (row) Db.update('Attempts', row, rec); else Db.append('Attempts', rec);
}

function logEvent_(email, aid, type, detail) {
  Db.append('Events', { Time: new Date(), Email: email, Assignment: aid, Type: type, Detail: detail || '' });
}

function findPart_(a, qid, pid) {
  var q = a.questions.filter(function (x) { return x.id === qid; })[0];
  if (!q) throw new Error('Question not found.');
  var p = q.parts.filter(function (x) { return x.id === pid; })[0];
  if (!p) throw new Error('Part not found.');
  return { q: q, p: p };
}

/** Apply integrity events sent by the page. Returns true if the attempt should lock. */
function applyEvents_(email, a, st, events, cfg) {
  var lockAfter = a.lockAfterLeaves || cfg.lockAfterLeaves;
  (events || []).slice(0, 50).forEach(function (ev) {
    var I = st.integrity;
    if (ev.type === 'leave') {
      var ms = Math.max(0, Math.min(+ev.ms || 0, 3600000));
      if (ev.reason === 'resource' && a.mode !== 'test') {
        // Leaving to watch a help video or search YouTube from the Coach: logged, not counted against the bonus.
        if (ms >= 1000) logEvent_(email, a.id, 'opened help link', Math.round(ms / 1000) + ' s' + (ev.where ? ' (' + String(ev.where).slice(0, 80) + ')' : ''));
        return;
      }
      var counts = a.mode === 'test' ? ms >= 1000 || ev.reason === 'fullscreen' : ms >= cfg.awayThresholdMs;
      if (counts) { I.leaves++; I.awayMs += ms; logEvent_(email, a.id, 'left page', Math.round(ms / 1000) + ' s' + (ev.reason ? ' (' + ev.reason + ')' : '')); }
    } else if (ev.type === 'paste') { I.pastes++; logEvent_(email, a.id, 'paste blocked', ev.where || ''); }
    else if (ev.type === 'copy') { I.copies++; }
    else if (ev.type === 'inject') { I.injected = (I.injected || 0) + 1; logEvent_(email, a.id, 'page changed by an extension', String(ev.where || '').slice(0, 60)); }
    else if (ev.type === 'autofill') { I.noTyping = (I.noTyping || 0) + 1; logEvent_(email, a.id, 'answer filled in without typing', String(ev.where || '').slice(0, 60)); }
  });
  return a.mode === 'test' && st.integrity.leaves >= lockAfter;
}

// ===================================================================
// Student API
// ===================================================================
function api_bootstrap() {
  var email = Auth.activeEmail();
  var teacher = isTeacher_(email);
  var stu = student_(email);
  if (!stu && !teacher) return { email: email, role: 'none' };
  var subs = Db.read('Submissions').filter(function (s) { return String(s.Email).toLowerCase() === email; });
  var atts = Db.read('Attempts').filter(function (x) { return String(x.Email).toLowerCase() === email; });
  var list = Db.read('Assignments').filter(function (r) { return r.Status === 'open' || teacher; }).map(function (r) {
    var sub = subs.filter(function (s) { return s.Assignment === r.ID; }).pop();
    var att = atts.filter(function (x) { return x.Assignment === r.ID; })[0];
    return { id: r.ID, section: r.Section, title: r.Title, mode: r.Mode || 'practice', status: r.Status, due: r.Due ? String(r.Due) : '',
      state: sub ? 'submitted' : (att ? att.Status : 'new') };
  });
  return { email: email, role: teacher ? 'teacher' : 'student', name: stu ? stu['First Name'] : '', assignments: list };
}

function api_open(aid) {
  var email = Auth.activeEmail();
  var teacher = isTeacher_(email);
  if (!student_(email) && !teacher) throw new Error('You are not on the class roster. Ask your teacher to add you.');
  var a = loadAssignment_(aid);
  if (a.status !== 'open' && !teacher) throw new Error('This assignment is closed.');
  var cfg = settings_();
  return Db.withLock(function () {
    var att = getAttempt_(email, aid);
    var submitted = Db.read('Submissions').some(function (s) { return String(s.Email).toLowerCase() === email && s.Assignment === aid; });
    var st = att ? att.state : newState_();
    var status = submitted ? 'submitted' : (att ? att.status : 'active');
    if (status === 'active') {
      st.integrity.opens = (st.integrity.opens || 0) + 1;
      // Reopening a test that was already started counts as leaving the page.
      if (a.mode === 'test' && att && st.integrity.opens > 1) {
        st.integrity.leaves++; logEvent_(email, aid, 'reopened test', '');
        if (st.integrity.leaves >= (a.lockAfterLeaves || cfg.lockAfterLeaves)) { status = 'locked'; st.integrity.lockouts++; logEvent_(email, aid, 'LOCKED', 'reopened'); }
      }
      putAttempt_(email, aid, status, st, att && att.row);
    }
    var hintsShown = {};
    Object.keys(st.hints).forEach(function (qid) {
      var q = a.questions.filter(function (x) { return x.id === qid; })[0];
      if (q) hintsShown[qid] = q.hints.slice(0, st.hints[qid]);
    });
    var revealed = {};
    Object.keys(st.revealed || {}).forEach(function (qid) {
      var q = a.questions.filter(function (x) { return x.id === qid; })[0];
      if (q) revealed[qid] = q.solution || [];
    });
    return {
      assignment: studentView_(a), status: status, answers: st.answers, results: a.mode === 'test' ? {} : st.results,
      checks: st.checks, hints: hintsShown, revealed: revealed, solutionLocks: cfg.solutionLocks,
      checksPerPart: a.checksPerPart || cfg.checksPerPart,
      lockAfterLeaves: a.lockAfterLeaves || cfg.lockAfterLeaves, leaves: st.integrity.leaves
    };
  });
}

function api_check(aid, qid, pid, response, meta) {
  var email = Auth.activeEmail();
  var a = loadAssignment_(aid);
  if (a.mode === 'test') throw new Error('Answer checking is off during a test.');
  var cfg = settings_(), limit = a.checksPerPart || cfg.checksPerPart;
  var f = findPart_(a, qid, pid);
  return Db.withLock(function () {
    var att = getAttempt_(email, aid);
    if (!att || att.status !== 'active') return { status: 'blocked', msg: 'This assignment is not active.' };
    var st = att.state, key = qid + '.' + pid;
    if (st.revealed[qid] && cfg.solutionLocks) return { status: 'blocked', msg: 'You opened the full solution for this problem, so its answers are locked.' };
    var r = Grader.grade(f.p, response, f.q.parts);
    st.answers[key] = response;
    if (r.status === 'invalid') { putAttempt_(email, aid, att.status, st, att.row); r.checksLeft = limit - (st.checks[key] || 0); return r; }
    if ((st.checks[key] || 0) >= limit && st.results[key] !== 'correct') {
      return { status: 'limit', msg: 'No checks left on this box. Use the coach, rework it on paper, and submit your best answer.', checksLeft: 0 };
    }
    st.checks[key] = (st.checks[key] || 0) + 1;
    st.results[key] = r.status;
    if (r.status === 'correct') { st.correctAt = st.correctAt || {}; st.correctAt[key] = new Date().toISOString(); }
    st.attempted[qid] = true;
    if (r.status === 'correct' && meta && +meta.msSinceShown < 8000 && +meta.keys < 2 &&
        ['number', 'equation', 'inequality', 'pair', 'set', 'solutions'].indexOf(f.p.type) >= 0) {
      st.integrity.fastCorrect++; logEvent_(email, aid, 'fast correct', key + ' in ' + Math.round(meta.msSinceShown / 1000) + ' s, ' + meta.keys + ' keys');
    }
    putAttempt_(email, aid, att.status, st, att.row);
    r.checksLeft = limit - st.checks[key];
    if (r.status === 'incorrect' && st.checks[key] >= 2 && (st.hints[qid] || 0) === 0 && f.q.hints && f.q.hints.length) {
      r.nudge = 'Try the Coach button for a hint. It will not give you the answer.';
    }
    return r;
  });
}

function api_hint(aid, qid) {
  var email = Auth.activeEmail();
  var a = loadAssignment_(aid);
  if (a.mode === 'test') throw new Error('The coach is off during a test.');
  var q = a.questions.filter(function (x) { return x.id === qid; })[0];
  if (!q || !q.hints || !q.hints.length) return { hints: [], done: true };
  return Db.withLock(function () {
    var att = getAttempt_(email, aid);
    if (!att || att.status !== 'active') return { hints: [], done: true };
    var st = att.state, level = st.hints[qid] || 0;
    if (level >= q.hints.length) return { hints: q.hints.slice(0, level), done: true };
    // The worked example (last hint) unlocks only after the student has tried the problem once.
    if (level === q.hints.length - 1 && !st.attempted[qid]) {
      return { hints: q.hints.slice(0, level), done: false, msg: 'Give it a try and check your answer once. Then the coach will show you a worked example.' };
    }
    st.hints[qid] = level + 1;
    putAttempt_(email, aid, att.status, st, att.row);
    return { hints: q.hints.slice(0, level + 1), done: level + 1 >= q.hints.length };
  });
}

/** Autosave. Also receives integrity events. Returns lock state. */
function api_save(aid, answers, events) {
  var email = Auth.activeEmail();
  var a = loadAssignment_(aid), cfg = settings_();
  return Db.withLock(function () {
    var att = getAttempt_(email, aid);
    if (!att) return { status: 'missing' };
    if (att.status !== 'active') return { status: att.status };
    var st = att.state;
    mergeAnswers_(st, answers, cfg);
    var lock = applyEvents_(email, a, st, events, cfg);
    var status = att.status;
    if (lock) { status = 'locked'; st.integrity.lockouts++; logEvent_(email, aid, 'LOCKED', 'left page ' + st.integrity.leaves + ' times'); }
    putAttempt_(email, aid, status, st, att.row);
    return { status: status, leaves: st.integrity.leaves, lockAfter: a.lockAfterLeaves || cfg.lockAfterLeaves };
  });
}

/** Copy answers from the page, skipping problems frozen by a solution reveal. */
function mergeAnswers_(st, answers, cfg) {
  Object.keys(answers || {}).forEach(function (k) {
    var qid = k.split('.')[0], v = answers[k];
    if (/\.__work$/.test(k)) {
      // On-screen work lines: always saved, never graded. Capped in size.
      st.answers[k] = (Array.isArray(v) ? v : []).slice(0, 40).map(function (x) { return String(x == null ? '' : x).slice(0, 200); });
      return;
    }
    if (cfg.solutionLocks && st.revealed && st.revealed[qid]) return;
    st.answers[k] = v;
  });
}

/**
 * Full worked solution for one problem. Allowed only in practice mode, after the student has opened every
 * hint and used all checks on at least one answer box without getting it right. Costs the no-AI bonus.
 */
function api_solution(aid, qid, answers) {
  var email = Auth.activeEmail();
  var a = loadAssignment_(aid), cfg = settings_();
  if (a.mode === 'test') throw new Error('Solutions are off during a test.');
  var q = a.questions.filter(function (x) { return x.id === qid; })[0];
  if (!q || !q.solution || !q.solution.length) throw new Error('No solution is available for this problem.');
  var limit = a.checksPerPart || cfg.checksPerPart;
  return Db.withLock(function () {
    var att = getAttempt_(email, aid);
    if (!att || att.status !== 'active') throw new Error('This assignment is not active.');
    var st = att.state;
    if (st.revealed[qid]) return { steps: q.solution, locked: cfg.solutionLocks };
    var hintsDone = (st.hints[qid] || 0) >= (q.hints || []).length;
    var outOfChecks = q.parts.some(function (p) {
      var k = qid + '.' + p.id;
      return p.type !== 'written' && (st.checks[k] || 0) >= limit && st.results[k] !== 'correct';
    });
    if (!hintsDone || !outOfChecks) {
      return { denied: true, msg: 'The full solution opens after you use every Coach hint and all ' + limit + ' checks on an answer box.' };
    }
    // Save what is on screen for this problem before freezing it.
    Object.keys(answers || {}).forEach(function (k) { if (k.split('.')[0] === qid) st.answers[k] = answers[k]; });
    st.revealed[qid] = new Date().toISOString();
    // Snapshot of this problem's answers at the moment the solution opened, so the teacher can see what changed after.
    st.beforeSol = st.beforeSol || {};
    q.parts.forEach(function (p) { var k = qid + '.' + p.id; st.beforeSol[k] = st.answers[k] === undefined ? null : st.answers[k]; });
    st.integrity.solutions = (st.integrity.solutions || 0) + 1;
    putAttempt_(email, aid, att.status, st, att.row);
    logEvent_(email, aid, 'viewed full solution', q.label);
    return { steps: q.solution, locked: cfg.solutionLocks };
  });
}

// ---------------- pictures ----------------
function api_image(key) {
  var email = Auth.activeEmail();
  if (!isTeacher_(email) && !student_(email)) throw new Error('Not on the roster.');
  key = String(key || '');
  if (typeof BUILTIN_IMAGES !== 'undefined' && BUILTIN_IMAGES[key]) {
    var b = BUILTIN_IMAGES[key];
    return 'data:' + b.mime + ';base64,' + b.data;
  }
  var cache = CacheService.getScriptCache(), hit = cache.get('img_' + key);
  if (hit) return hit;
  // Uploaded pictures are stored in the Images tab, split into chunks (a cell holds at most 50,000 characters).
  var rows = Db.read('Images').filter(function (r) { return r.Key === key; }).sort(function (x, y) { return x.Part - y.Part; });
  if (!rows.length) throw new Error('Picture not found.');
  var url = 'data:' + rows[0].Mime + ';base64,' + rows.map(function (r) { return r.Data; }).join('');
  if (url.length < 95000) cache.put('img_' + key, url, 21600);
  return url;
}

/** Teacher uploads a picture (data URL from the page, already shrunk to 1400 px JPEG). Stored in the Images tab. */
function t_uploadImage(dataUrl, name) {
  requireTeacher_();
  var m = String(dataUrl).match(/^data:(image\/(png|jpeg|gif|webp));base64,([A-Za-z0-9+\/=]+)$/);
  if (!m) throw new Error('Upload a PNG, JPEG, GIF, or WEBP picture.');
  if (m[3].length > 2500000) throw new Error('Picture is too large. Use a smaller picture.');
  var key = 'img-' + Utilities.getUuid().slice(0, 8), CH = 45000, now = new Date();
  for (var i = 0, part = 0; i < m[3].length; i += CH, part++) {
    Db.append('Images', { Key: key, Part: part, Mime: m[1], Name: name || '', Uploaded: now, Data: m[3].slice(i, i + CH) });
  }
  return { key: key };
}

function scoreAttempt_(a, st) {
  var auto = 0, writtenMax = 0, max = 0, detail = {};
  a.questions.forEach(function (q) {
    var pts = q.points || 1, n = q.parts.length;
    max += pts;
    q.parts.forEach(function (p) {
      var key = q.id + '.' + p.id, share = pts / n;
      if (p.type === 'written') { writtenMax += share; detail[key] = 'pending'; return; }
      var resp = st.answers[key];
      var r = (resp === undefined || resp === '' || resp === null) ? { status: 'blank' } : Grader.grade(p, resp, q.parts);
      detail[key] = r.status === 'correct' ? 'correct' : (r.status === 'blank' ? 'blank' : 'incorrect');
      if (r.status === 'correct') auto += share;
    });
  });
  return { auto: round2_(auto), writtenMax: round2_(writtenMax), max: max, detail: detail };
}
function round2_(x) { return Math.round(x * 100) / 100; }

function api_submit(aid, answers, events) {
  var email = Auth.activeEmail();
  var a = loadAssignment_(aid), cfg = settings_();
  return Db.withLock(function () {
    var att = getAttempt_(email, aid);
    if (!att) throw new Error('Nothing to submit.');
    if (att.status === 'submitted') return { status: 'submitted' };
    var st = att.state;
    if (att.status === 'active') mergeAnswers_(st, answers, cfg);
    applyEvents_(email, a, st, events, cfg);
    var sc = scoreAttempt_(a, st);
    var I = st.integrity;
    var hintsUsed = Object.keys(st.hints).reduce(function (s, k) { return s + st.hints[k]; }, 0);
    var eligible = I.pastes === 0 && !(I.noTyping > 0) && I.leaves <= cfg.bonusMaxLeaves && I.lockouts === 0 && !(I.solutions > 0);
    var pct = sc.max ? sc.auto / sc.max * 100 : 0;
    var stu = student_(email) || {};
    Db.append('Submissions', {
      Submitted: new Date(), Email: email, 'Last Name': stu['Last Name'] || '', 'First Name': stu['First Name'] || '',
      'Student ID': stu['Student ID'] || '', Period: stu.Period || '', Assignment: aid, Mode: a.mode,
      'Auto Points': sc.auto, 'Written Points': sc.writtenMax ? '' : 0, 'Written Max': sc.writtenMax, 'Max Points': sc.max,
      Percent: round2_(pct), 'No-AI Bonus Eligible': eligible ? 'YES' : 'NO',
      'Final Percent': round2_(pct * (eligible ? cfg.bonusMultiplier : 1)),
      'Hints Used': hintsUsed, 'Paste Attempts': I.pastes, 'Times Left Page': I.leaves, 'Seconds Away': Math.round(I.awayMs / 1000),
      'Fast Answers': I.fastCorrect, Lockouts: I.lockouts, 'Solutions Viewed': I.solutions || 0,
      Answers: JSON.stringify({ answers: st.answers, detail: sc.detail, revealed: Object.keys(st.revealed || {}) })
    });
    putAttempt_(email, aid, 'submitted', st, att.row);
    var showScore = a.mode !== 'test' || cfg.showTestScore;
    return { status: 'submitted', score: showScore ? { auto: sc.auto, max: sc.max, writtenMax: sc.writtenMax } : null,
      detail: a.mode === 'test' ? null : sc.detail };
  });
}

function t_overview() {
  requireTeacher_();
  var subs = Db.read('Submissions'), atts = Db.read('Attempts'), roster = Db.read('Roster');
  return {
    settings: settings_(),
    rosterCount: roster.length,
    assignments: Db.read('Assignments').map(function (r) {

        checks: r['Checks Per Part'], lockAfter: r['Lock After Leaves'], due: r.Due ? String(r.Due) : '',
        submitted: subs.filter(function (s) { return s.Assignment === r.ID; }).length,

    })
  };
}

function t_setAssignment(aid, fields) {
  requireTeacher_();
  var row = assignmentRow_(aid);
  if (!row) throw new Error('Not found');
  var rec = {};
  if (fields.status) rec.Status = fields.status === 'open' ? 'open' : 'closed';
  if (fields.mode) rec.Mode = fields.mode === 'test' ? 'test' : 'practice';
  if (fields.calculator) rec.Calculator = ['graphing', 'basic', 'off'].indexOf(fields.calculator) >= 0 ? fields.calculator : 'basic';
  if (fields.checks !== undefined) rec['Checks Per Part'] = fields.checks;
  if (fields.lockAfter !== undefined) rec['Lock After Leaves'] = fields.lockAfter;
  if (fields.due !== undefined) rec.Due = fields.due;
  Db.update('Assignments', row._row, rec);
  return t_overview();
}

function t_students(aid) {
  requireTeacher_();
  var a = loadAssignment_(aid);
  var roster = Db.read('Roster'), subs = Db.read('Submissions').filter(function (s) { return s.Assignment === aid; });
  var atts = Db.read('Attempts').filter(function (x) { return x.Assignment === aid; });
  var rows = roster.map(function (st) {
    var em = String(st.Email).toLowerCase();
    var sub = subs.filter(function (s) { return String(s.Email).toLowerCase() === em; }).pop();
    var att = atts.filter(function (x) { return String(x.Email).toLowerCase() === em; })[0];
    var I = att ? (JSON.parse(att.State || '{}').integrity || {}) : {};
    return { email: em, last: st['Last Name'], first: st['First Name'], id: st['Student ID'], period: st.Period,
      state: sub ? 'submitted' : (att ? att.Status : 'not started'),
      sub: sub ? { row: sub._row, auto: sub['Auto Points'], written: sub['Written Points'], writtenMax: sub['Written Max'], max: sub['Max Points'],
        percent: sub.Percent, eligible: sub['No-AI Bonus Eligible'], final: sub['Final Percent'], hints: sub['Hints Used'] } : null,
      integrity: sub ? { pastes: sub['Paste Attempts'], leaves: sub['Times Left Page'], away: sub['Seconds Away'], fast: sub['Fast Answers'], lockouts: sub.Lockouts, solutions: sub['Solutions Viewed'] || 0 }
        : { pastes: I.pastes || 0, leaves: I.leaves || 0, away: Math.round((I.awayMs || 0) / 1000), fast: I.fastCorrect || 0, lockouts: I.lockouts || 0, solutions: I.solutions || 0 } };
  });
  rows.sort(function (x, y) { return String(x.last).localeCompare(String(y.last)); });
  return { assignment: { id: a.id, title: a.title, section: a.section, mode: a.mode }, rows: rows };
}

/** Full view of one student's work, including written answers next to the sample answers. */
function t_review(aid, email) {
  requireTeacher_();
  var a = loadAssignment_(aid);
  var sub = Db.read('Submissions').filter(function (s) { return s.Assignment === aid && String(s.Email).toLowerCase() === email; }).pop();
  var att = getAttempt_(email, aid);
  var data = sub ? JSON.parse(sub.Answers) : { answers: att ? att.state.answers : {}, detail: att ? scoreAttempt_(a, att.state).detail : {} };
  return { assignment: a, answers: data.answers, detail: data.detail, written: sub ? sub['Written Points'] : '', writtenMax: sub ? sub['Written Max'] : 0,
    hints: att ? att.state.hints : {}, checks: att ? att.state.checks : {}, revealed: att ? Object.keys(att.state.revealed || {}) : [] };
}

function t_setWritten(aid, email, points) {
  requireTeacher_();
  var cfg = settings_();
  return Db.withLock(function () {
    var sub = Db.read('Submissions').filter(function (s) { return s.Assignment === aid && String(s.Email).toLowerCase() === email; }).pop();
    if (!sub) throw new Error('No submission.');
    var w = Math.max(0, Math.min(+points || 0, +sub['Written Max'] || 0));
    var pct = (+sub['Auto Points'] + w) / (+sub['Max Points']) * 100;
    Db.update('Submissions', sub._row, { 'Written Points': w, Percent: round2_(pct),
      'Final Percent': round2_(pct * (sub['No-AI Bonus Eligible'] === 'YES' ? cfg.bonusMultiplier : 1)) });
    return true;
  });
}

function t_setBonus(aid, email, yes) {
  requireTeacher_();
  var cfg = settings_();
  var sub = Db.read('Submissions').filter(function (s) { return s.Assignment === aid && String(s.Email).toLowerCase() === email; }).pop();
  if (!sub) throw new Error('No submission.');
  Db.update('Submissions', sub._row, { 'No-AI Bonus Eligible': yes ? 'YES' : 'NO', 'Final Percent': round2_(+sub.Percent * (yes ? cfg.bonusMultiplier : 1)) });
  return true;
}

function t_unlock(aid, email) {
  var t = requireTeacher_();
  return Db.withLock(function () {
    var att = getAttempt_(email, aid);
    if (!att) throw new Error('No attempt found.');
    att.state.integrity.leaves = 0;
    att.state.integrity.opens = 0;
    putAttempt_(email, aid, 'active', att.state, att.row);
    logEvent_(email, aid, 'unlocked', 'by ' + t);
    return true;
  });
}

/** Let a student redo work: removes the submission and reactivates the attempt (answers kept). */
function t_reopen(aid, email, clearAnswers) {
  var t = requireTeacher_();
  return Db.withLock(function () {
    var subs = Db.read('Submissions').filter(function (s) { return s.Assignment === aid && String(s.Email).toLowerCase() === email; });
    subs.sort(function (x, y) { return y._row - x._row; }).forEach(function (s) { Db.remove('Submissions', s._row); });
    var att = getAttempt_(email, aid);
    if (att) {
      var st = clearAnswers ? newState_() : att.state;
      st.integrity.leaves = 0; st.integrity.opens = 0;
      putAttempt_(email, aid, 'active', st, att.row);
    }
    logEvent_(email, aid, 'reopened by teacher', t);
    return true;
  });
}

function t_events(aid, email) {
  requireTeacher_();
  return Db.read('Events').filter(function (e) { return e.Assignment === aid && (!email || String(e.Email).toLowerCase() === email); })
    .map(function (e) { return { time: String(e.Time), email: e.Email, type: e.Type, detail: e.Detail }; }).slice(-300);
}

function t_getAssignment(aid) { requireTeacher_(); return loadAssignment_(aid); }

/** Replace an assignment's lesson materials and videos. Each: {title, url, kind: slides|notes|video|link, group}. */
function t_setResources(aid, list) {
  requireTeacher_();
  var a = loadAssignment_(aid);
  a.resources = (list || []).filter(function (r) { return r && /^https:\/\//i.test(String(r.url || '')); }).slice(0, 60).map(function (r) {
    return { title: String(r.title || 'Resource').slice(0, 120), url: String(r.url).slice(0, 500),
      kind: ['slides', 'notes', 'video', 'link'].indexOf(r.kind) >= 0 ? r.kind : 'link', group: String(r.group || '').slice(0, 80) };
  });
  saveAssignment_(a, true);
  return a.resources;
}

/** Import or replace an assignment from JSON. Runs the answer self-test first. */
function t_import(json, overwrite) {
  requireTeacher_();
  var a = typeof json === 'string' ? JSON.parse(json) : json;
  var errs = validateAssignment_(a);
  if (errs.length) return { ok: false, errors: errs };
  var problems = Grader.selfTest(a);
  if (problems.length) return { ok: false, errors: ['Answer key self-test failed:'].concat(problems) };
  if (a.resources && !Array.isArray(a.resources)) return { ok: false, errors: ['resources must be a list.'] };
  if (assignmentRow_(a.id) && !overwrite) return { ok: false, exists: true, errors: ['An assignment with ID "' + a.id + '" already exists. Import again with Replace checked.'] };
  saveAssignment_(a, false);
  return { ok: true, id: a.id, questions: a.questions.length };
}

function validateAssignment_(a) {
  var e = [];
  var TYPES = ['number', 'choice', 'pair', 'set', 'inequality', 'equation', 'solutions', 'graph', 'table', 'written'];
  if (!a || typeof a !== 'object') return ['Not an assignment object.'];
  if (!a.id || !/^[\w.\-]+$/.test(a.id)) e.push('id is required (letters, numbers, dot, dash).');
  if (!a.title) e.push('title is required.');
  if (!Array.isArray(a.questions) || !a.questions.length) e.push('questions must be a non-empty list.');
  var qids = {};
  (a.questions || []).forEach(function (q, i) {
    var w = 'Question ' + (q.label || i + 1) + ': ';
    if (!q.id) e.push(w + 'id missing.'); else if (qids[q.id]) e.push(w + 'duplicate id ' + q.id); qids[q.id] = 1;
    if (!q.prompt) e.push(w + 'prompt missing.');
    if (!Array.isArray(q.parts) || !q.parts.length) e.push(w + 'needs at least one part.');
    if (q.hints && !Array.isArray(q.hints)) e.push(w + 'hints must be a list.');
    if (q.solution && !Array.isArray(q.solution)) e.push(w + 'solution must be a list of steps.');
    if (q.image && (typeof q.image !== 'object' || !q.image.key)) e.push(w + 'image needs a key (upload the picture first).');
    if (q.search && typeof q.search !== 'string') e.push(w + 'search must be text.');
    (q.parts || []).forEach(function (p) {
      if (TYPES.indexOf(p.type) < 0) e.push(w + 'unknown part type ' + p.type);
      if (p.type !== 'written' && p.type !== 'solutions' && p.type !== 'graph' && p.type !== 'table' && (p.answer === undefined || p.answer === '')) e.push(w + 'part ' + p.id + ' needs an answer.');
      if (p.type === 'choice' && (!Array.isArray(p.options) || p.options.indexOf(p.answer) < 0)) e.push(w + 'choice answer must be one of the options.');
      if (p.type === 'graph' && !p.grid) e.push(w + 'graph part needs a grid.');
      if (p.type === 'graph' && p.mode === 'line' && !p.line) e.push(w + 'line graph needs a line equation.');
      if (p.type === 'graph' && p.mode === 'points' && !Array.isArray(p.answer)) e.push(w + 'points graph needs a list of answer points.');
      if (p.type === 'solutions' && !p.equation) e.push(w + 'solutions part needs an equation.');
      if (p.type === 'table' && !p.line && !(Array.isArray(p.points) && Array.isArray(p.xs))) e.push(w + 'table part needs a line equation, or xs plus answer points.');
    });
  });
  return e;
}

function t_deleteAssignment(aid) {
  requireTeacher_();
  var row = assignmentRow_(aid);
  if (row) Db.remove('Assignments', row._row);
  return t_overview();
}

/** Builds the Skyward import file (Last Name, First Name, ID, Score) and writes it to the Skyward Export tab. */
function t_skyward(aid, scoreMode) {
  requireTeacher_();
  var cfg = settings_();
  var mode = scoreMode || cfg.skywardScore;
  var roster = Db.read('Roster');
  var subs = Db.read('Submissions').filter(function (s) { return s.Assignment === aid; });
  var rows = roster.map(function (st) {
    var sub = subs.filter(function (s) { return String(s.Email).toLowerCase() === String(st.Email).toLowerCase(); }).pop();
    var score = '';
    if (sub) {
      score = mode === 'points' ? round2_(+sub['Auto Points'] + (+sub['Written Points'] || 0)) : Math.round(+sub['Final Percent'] * 10) / 10;
    }
    return { 'Last Name': st['Last Name'], 'First Name': st['First Name'], ID: st['Student ID'], Score: score };
  }).sort(function (x, y) { return String(x['Last Name']).localeCompare(String(y['Last Name'])); });
  Db.replaceAll('Skyward Export', rows);
  var csv = ['Last Name,First Name,ID,Score'].concat(rows.map(function (r) {
    return [r['Last Name'], r['First Name'], r.ID, r.Score].map(function (v) { v = String(v); return /[",]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',');
  })).join('\r\n');
  var pending = subs.filter(function (s) { return +s['Written Max'] > 0 && s['Written Points'] === ''; }).length;
  return { csv: csv, filename: aid + '_skyward.csv', count: rows.filter(function (r) { return r.Score !== ''; }).length, pendingWritten: pending };
}

<script>
/**
 * engine.js

    withLock: function (fn) { return fn(); },

  function runner(ok, fail) {
    return new Proxy({}, {
      get: function (t, name) {
        if (name === 'withSuccessHandler') return function (h) { return runner(h, fail); };
        if (name === 'withFailureHandler') return function (h) { return runner(ok, h); };

  function buildKeys() {
    var box = document.getElementById('keys');
    KEYS.forEach(function (k) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = k[0]; if (k[1]) b.className = k[1];
      b.addEventListener('pointerdown', function (ev) { ev.preventDefault(); });

  }
  function setNativeKeyboard(off) {

  }
  function toggleKeypad(on) {

    document.body.classList.toggle('kp-open', kpOn);

  }

  // ---------- calculator ----------
  var fns = [{ src: '', fn: null, color: '#2b6cb0' }, { src: '', fn: null, color: '#c53030' }, { src: '', fn: null, color: '#2f855a' }, { src: '', fn: null, color: '#805ad5' }];
  var view = { cx: 0, cy: 0, half: 10 }, traceX = null;

  function setMode(m) {

    var cb = document.getElementById('btnCalc');

    if (mode !== 'graphing') tab('calc');
    if (mode === 'off') toggleCalc(false);
  }
  function tab(which) {
    document.getElementById('calcPaneCalc').style.display = which === 'calc' ? '' : 'none';
    document.getElementById('calcPaneGraph').style.display = which === 'graph' ? '' : 'none';
    document.getElementById('calcTabCalc').classList.toggle('on', which === 'calc');
    document.getElementById('calcTabGraph').classList.toggle('on', which === 'graph');

  }
  function toggleCalc(on) {
    calcOn = on === undefined ? !calcOn : on;
    if (mode === 'off') calcOn = false;
    var panel = document.getElementById('calc'), bar = document.querySelector('.bar');
    if (bar) panel.style.top = Math.max(0, bar.getBoundingClientRect().bottom) + 'px';
    panel.style.display = calcOn ? 'flex' : 'none';
    var b = document.getElementById('btnCalc'); if (b) b.classList.toggle('on', calcOn);
    if (calcOn && document.getElementById('calcPaneGraph').style.display !== 'none') drawGraph();
  }
  function evaluate() {
    var inp = document.getElementById('calcIn'), src = inp.value.trim(); if (!src) return;
    var hist = document.getElementById('calcHistory'), row = document.createElement('div');
    try {
      var v = AMath.compile(src)({}); var f = AMath.frac(v);
      row.innerHTML = '<div>' + esc(src) + '</div><div class="res">= ' + esc(AMath.fmt(v)) + (f ? '  (' + esc(f) + ')' : '') + '</div>';
      inp.value = '';
    } catch (e) { row.innerHTML = '<div>' + esc(src) + '</div><div class="res" style="color:var(--bad)">' + esc(e.message) + '</div>'; }
    hist.appendChild(row); hist.scrollTop = hist.scrollHeight;
    while (hist.children.length > 30) hist.removeChild(hist.firstChild);
  }
  function buildCalcPad() {
    var pad = document.getElementById('calcPad');
    ['7', '8', '9', '÷', '(', '4', '5', '6', '×', ')', '1', '2', '3', '−', '^', '0', '.', '√', '+', '⌫'].forEach(function (k) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = k;
      b.addEventListener('pointerdown', function (ev) { ev.preventDefault(); });
      b.onclick = function () {
        var el = document.getElementById('calcIn'); active = el;
        if (k === '⌫') key('back'); else insert(k === '√' ? '√(' : k);
      };
      pad.appendChild(b);
    });
  }
  function buildFnList() {
    var list = document.getElementById('fnList');
    fns.forEach(function (f, i) {
      var row = document.createElement('div'); row.className = 'fnrow';
      row.innerHTML = '<span class="sw" style="background:' + f.color + '"></span><span class="lbl">y =</span>';
      var inp = document.createElement('input'); inp.type = 'text'; inp.className = 'ans-like'; inp.placeholder = i === 0 ? 'e.g. -2x + 5' : ''; inp.autocomplete = 'off';
      var err = document.createElement('div'); err.className = 'err';
      inp.addEventListener('input', function () {
        f.src = inp.value; err.textContent = '';
        if (!inp.value.trim()) { f.fn = null; drawGraph(); return; }
        try { var c = AMath.compile(inp.value); c({ x: 1 }); f.fn = c; } catch (e) { f.fn = null; err.textContent = e.message; }
        drawGraph();
      });
      var wrap = document.createElement('div'); wrap.className = 'grow'; wrap.appendChild(inp); wrap.appendChild(err);
      row.appendChild(wrap); list.appendChild(row);
    });
  }
  function niceStep(span) { var raw = span / 10, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p; return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p; }
  function drawGraph() {
    var cv = document.getElementById('calcCanvas'); if (!cv || document.getElementById('calcPaneGraph').style.display === 'none') return;
    var ctx = cv.getContext('2d'), W = cv.width, H = cv.height, h = view.half;
    var x0 = view.cx - h, x1 = view.cx + h, y0 = view.cy - h, y1 = view.cy + h;
    function X(x) { return (x - x0) / (x1 - x0) * W; } function Y(y) { return H - (y - y0) / (y1 - y0) * H; }
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    var st = niceStep(2 * h); ctx.lineWidth = 1; ctx.font = '22px Calibri, Carlito, Arial'; ctx.fillStyle = '#5b6478';
    for (var gx = Math.ceil(x0 / st) * st; gx <= x1; gx += st) { ctx.strokeStyle = '#e6e9f1'; ctx.beginPath(); ctx.moveTo(X(gx), 0); ctx.lineTo(X(gx), H); ctx.stroke(); if (Math.abs(gx) > st / 2) ctx.fillText(+gx.toFixed(6), X(gx) + 3, Math.min(Math.max(Y(0) + 22, 22), H - 6)); }
    for (var gy = Math.ceil(y0 / st) * st; gy <= y1; gy += st) { ctx.strokeStyle = '#e6e9f1'; ctx.beginPath(); ctx.moveTo(0, Y(gy)); ctx.lineTo(W, Y(gy)); ctx.stroke(); if (Math.abs(gy) > st / 2) ctx.fillText(+gy.toFixed(6), Math.min(Math.max(X(0) + 4, 4), W - 60), Y(gy) - 4); }
    ctx.strokeStyle = '#1E2761'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(X(0), 0); ctx.lineTo(X(0), H); ctx.moveTo(0, Y(0)); ctx.lineTo(W, Y(0)); ctx.stroke();
    fns.forEach(function (f) {
      if (!f.fn) return; ctx.strokeStyle = f.color; ctx.lineWidth = 4; ctx.beginPath(); var pen = false;
      for (var i = 0; i <= W; i += 2) {
        var x = x0 + i / W * (x1 - x0), y; try { y = f.fn({ x: x }); } catch (e) { y = NaN; }
        if (!isFinite(y) || Math.abs(y) > 1e6) { pen = false; continue; }
        if (pen) ctx.lineTo(i, Y(y)); else { ctx.moveTo(i, Y(y)); pen = true; }
      }
      ctx.stroke();
    });
    if (traceX !== null) {
      var f0 = fns.filter(function (f) { return f.fn; })[0];
      if (f0) { var ty = f0.fn({ x: traceX }); if (isFinite(ty)) { ctx.fillStyle = '#E8A33D'; ctx.beginPath(); ctx.arc(X(traceX), Y(ty), 10, 0, 7); ctx.fill(); document.getElementById('trace').textContent = 'x = ' + AMath.fmt(+traceX.toFixed(4)) + ', y = ' + AMath.fmt(+ty.toFixed(4)); } }
    }
  }
  function wireGraph() {
    var cv = document.getElementById('calcCanvas'), drag = null;
    cv.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy, moved: false }; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', function (e) {

    });

    document.getElementById('zOut').onclick = function () { view.half *= 2; drawGraph(); };
    document.getElementById('zReset').onclick = function () { view = { cx: 0, cy: 0, half: 10 }; traceX = null; document.getElementById('trace').textContent = 'Drag to move. Tap to trace.'; drawGraph(); };
  }
  function init() {
    buildKeys(); buildCalcPad(); buildFnList(); wireGraph();
    document.getElementById('calcTabGraph').onclick = function () { tab('graph'); };
    document.getElementById('calcTabCalc').onclick = function () { tab('calc'); };
    document.getElementById('calcGo').onclick = evaluate;
    document.getElementById('calcIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); evaluate(); } });
    try { if (localStorage.getItem('ac_kp') === '1') toggleKeypad(true); } catch (e) {}
  }

})();
</script>


<script>
var S = { aid: null, A: null, mode: 'practice', status: null, answers: {}, results: {}, checks: {}, hints: {}, revealed: {}, solutionLocks: true,
  checksPerPart: 3, lockAfter: 2, leaves: 0, events: [], dirty: false, keys: {}, shownAt: {}, saving: false, plotters: {} };
var LOCAL = 'ac_draft_';
var WEBAPP = location.href.split('?')[0].split('#')[0];
var START_AID = (new URLSearchParams(location.search).get('a') || '').replace(/[^\w.\-]/g, '');

// ---------------- integrity ----------------
var leaveStart = null, leaveReason = '', fsWanted = false;
var resourceOut = null;
function startLeave(reason) {
  if (!S.aid || S.status !== 'active') return;
  if (leaveStart === null) { leaveStart = Date.now(); leaveReason = (resourceOut && Date.now() - resourceOut.t < 4000) ? 'resource' : reason; }
}
function endLeave() {
  if (leaveStart === null || document.hidden) return;
  var ms = Date.now() - leaveStart, reason = leaveReason; leaveStart = null; leaveReason = '';
  S.events.push({ type: 'leave', ms: ms, reason: reason, where: reason === 'resource' && resourceOut ? resourceOut.where : '' });
  if (reason === 'resource') resourceOut = null;
  if (S.mode === 'test') save(true);
}
document.addEventListener('visibilitychange', function () { if (document.hidden) startLeave('tab'); else if (!fsWanted || isFullscreen()) endLeave(); });
window.addEventListener('blur', function () { startLeave('window'); });
window.addEventListener('focus', function () { if (!fsWanted || isFullscreen()) endLeave(); });
function blockPaste(e) {
  e.preventDefault();
  var k = e.target && e.target.dataset ? e.target.dataset.key : '';
  S.events.push({ type: 'paste', where: k || '' }); S.dirty = true;
  toast('Pasting is turned off. Type your own answer.');
}
document.addEventListener('paste', blockPaste, true);
// Algebra notation: show * as a raised dot (·) as students type. Graders read both.
document.addEventListener('input', function (e) {
  var el = e.target;
  if (!el || el.tagName !== 'INPUT' || !el.classList.contains('ans') || el.value.indexOf('*') < 0) return;
  var pos = el.selectionStart; el.value = el.value.replace(/\*/g, '·');
  try { el.setSelectionRange(pos, pos); } catch (x) {}
}, true);
document.addEventListener('drop', function (e) { e.preventDefault(); }, true);
document.addEventListener('copy', function (e) { if (window.__allowCopy) return; e.preventDefault(); S.events.push({ type: 'copy' }); }, true);
document.addEventListener('cut', function (e) { e.preventDefault(); }, true);
document.addEventListener('contextmenu', function (e) { if (!e.target.closest || !e.target.closest('input,textarea')) e.preventDefault(); });

function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function enterFullscreen() {
  var el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen;
  document.getElementById('fsCover').style.display = 'none';
  if (fn) { try { var p = fn.call(el); if (p && p.catch) p.catch(function () { fsWanted = false; endLeave(); }); } catch (e) { fsWanted = false; } }
  else fsWanted = false;
  setTimeout(endLeave, 400);
}
function onFsChange() {
  if (!fsWanted || S.status !== 'active') return;
  if (!isFullscreen()) {
    startLeave('fullscreen');
    document.getElementById('fsCount').textContent = 'Times left so far: ' + (S.leaves + 1) + ' of ' + S.lockAfter + '. At ' + S.lockAfter + ' the test locks.';
    document.getElementById('fsCover').style.display = 'flex';
  }
}
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);

// ---------------- saving ----------------
function localSave() { try { localStorage.setItem(LOCAL + S.aid, JSON.stringify({ t: Date.now(), answers: S.answers })); } catch (e) {} }
function localLoad(aid) { try { return JSON.parse(localStorage.getItem(LOCAL + aid) || 'null'); } catch (e) { return null; } }
function setSaveStatus(t) { document.getElementById('saveStatus').textContent = t; }

function save(force) {
  if (!S.aid || S.status !== 'active') return Promise.resolve();
  if (S.saving) { if (force) S.pendingForce = true; return Promise.resolve(); }
  if (!force && !S.dirty && !S.events.length) return Promise.resolve();
  var evs = S.events.splice(0), answers = S.answers;
  S.saving = true; S.dirty = false; setSaveStatus('Saving…');
  return call('api_save', S.aid, answers, evs).then(function (r) {
    S.saving = false;
    setSaveStatus('Saved ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));
    if (r.leaves !== undefined) { S.leaves = r.leaves; updateLeaveBanner(); }
    if (r.status === 'locked') { S.status = 'locked'; showLocked(); }
    if (r.status === 'submitted') { S.status = 'submitted'; }
    if (S.pendingForce) { S.pendingForce = false; save(true); }
  }).catch(function () {
    S.saving = false; S.dirty = true; S.events = evs.concat(S.events);

setInterval(function () { save(false); }, 12000);

  p.then(function () { document.getElementById('btnFocus').style.display = 'none'; S.aid = null; fsWanted = false; Tools.toggleCalc(false); Tools.setMode('basic'); loadHome(); });
}
function loadHome() {
  document.getElementById('barTitle').textContent = 'Algebra Coach';
  document.getElementById('btnHome').style.display = 'none';

    var h = '<div class="card"><h2>Hi' + (b.name ? ' ' + esc(b.name) : '') + '</h2><p class="muted">Pick an assignment. Your work saves as you go. Use the Coach for hints. It will help you think it through, not give you the answer.</p>' +

    if (!b.assignments.length) h += '<div class="card muted">No assignments are open right now.</div>';
    b.assignments.forEach(function (a) {

      h += '<div class="card list-item"><div class="grow"><b>' + esc(a.section) + ' ' + esc(a.title) + '</b><br><span class="muted">' + esc(st) +

}
function showError(e) { document.getElementById('view').innerHTML = '<div class="card"><h2>Something went wrong</h2><p>' + esc(e && e.message || e) + '</p><button type="button" onclick="loadHome()">Back</button></div>'; }

// ---------------- open ----------------

    S.checksPerPart = r.checksPerPart; S.lockAfter = r.lockAfterLeaves; S.leaves = r.leaves || 0; S.events = []; S.keys = {}; S.shownAt = {};

    document.getElementById('btnHome').style.display = '';
    Tools.setMode(S.A.calculator);
    if (r.status === 'locked') return showLocked();
    if (r.status === 'submitted') return showSubmitted(null);

  }).catch(showError);
}

function showTestStart() {
  var v = document.getElementById('view');
  v.innerHTML = '<div class="card"><span class="tag test">TEST MODE</span><h2 style="margin-top:8px">' + esc(S.A.section + ' ' + S.A.title) + '</h2>' +
    '<ul><li>Hints, the Coach, and answer checking are off.</li><li>The test opens in full screen.</li>' +
    '<li>Leaving the page, switching tabs or apps, or leaving full screen is recorded.</li>' +
    '<li><b>After ' + S.lockAfter + ' exits, the test locks.</b> Your answers are saved, and your teacher has to unlock it.</li>' +
    '<li>Your work saves automatically.</li></ul>' +
    '<button type="button" class="amber big" onclick="startTest()">Start test</button></div>';

function startTest() { fsWanted = true; enterFullscreen(); render(); }

function showLocked() {

// ---------------- render ----------------
function key(q, p) { return q.id + '.' + p.id; }

function render() {
  var A = S.A, v = document.getElementById('view'), h = '';

  h += '<div class="card"><div class="row"><span class="tag ' + (S.mode === 'test' ? 'test' : '') + '">' + (S.mode === 'test' ? 'TEST' : 'PRACTICE') + '</span>' +
    '<span class="muted">' + esc(A.course || '') + ' · Larson Algebra 1 ' + esc(A.pages || '') + '</span></div>' +
    (S.mode === 'test' ? '<p class="muted">Hints and answer checking are off. Do your own work.</p>' :

    (S.mode !== 'test' && A.resources && A.resources.length ? '<button type="button" class="small" onclick="showMaterials()">📚 Lesson materials (' + A.resources.length + ')</button>' : '') +

function wirePart(q, p) {
  var k = key(q, p), id = 'p_' + k.replace(/\W/g, '_'), el = document.getElementById(id);
  if (!el) return;
  function changed(v) { if (S.revealed[q.id] && S.solutionLocks) return; S.answers[k] = v; S.dirty = true; localSave(); updateProgress(); clearFb(id); }
  if (p.type === 'choice') {
    el.querySelectorAll('button').forEach(function (b) {
      b.onclick = function () { el.querySelectorAll('button').forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); changed(b.dataset.val); };
    });
  } else if (p.type === 'table') {
    wireTable(q, p, el, changed);
  } else if (p.type === 'graph') {
    S.plotters[k] = AGraph.plotter(el, p, S.answers[k], function (st) { changed(st); });
    if (S.results[k] === 'correct' && S.mode !== 'test') S.plotters[k].disable();
  } else {
    el.addEventListener('input', function () { changed(el.value); });
    el.addEventListener('keydown', function (e) { S.keys[k] = (S.keys[k] || 0) + 1; if (e.key === 'Enter' && el.tagName === 'INPUT' && S.mode !== 'test') { e.preventDefault(); check(q.id, p.id); } });
    if (S.results[k] === 'correct' && S.mode !== 'test') el.readOnly = true;

}
function tableRows(p, val) {
  var rows = (val && Array.isArray(val.rows)) ? val.rows.map(function (r) { return [String(r[0] == null ? '' : r[0]), String(r[1] == null ? '' : r[1])]; }) : [];
  var n = p.xs ? p.xs.length : Math.max(p.rows || 3, rows.length);
  while (rows.length < n) rows.push(['', '']);

  return rows;
}
function tableHtml(p, val, bad) {

  var h = '<table class="xy"><tr><th>' + esc(xv) + '</th><th>' + esc(yv) + '</th></tr>';
  rows.forEach(function (r, i) {

      '<td><input type="text" class="ans" data-r="' + i + '" data-c="1" value="' + esc(r[1]) + '" placeholder="' + esc(yv) + '" autocomplete="off" autocapitalize="off" spellcheck="false"></td></tr>';

  var locked = S.results[k] === 'correct' && S.mode !== 'test';
  el.querySelectorAll('input').forEach(function (inp) {

      var tr = inp.closest('tr'); if (tr) tr.classList.remove('bad');

}

function check(qid, pid) {
  var q = S.A.questions.filter(function (x) { return x.id === qid; })[0], p = q.parts.filter(function (x) { return x.id === pid; })[0];
  var k = qid + '.' + pid, id = 'p_' + k.replace(/\W/g, '_'), resp = S.answers[k];

  var meta = { msSinceShown: S.shownAt[qid] ? Date.now() - S.shownAt[qid] : 99999, keys: S.keys[k] || 0 };
  trackOnce(S.aid, 'started');
  call('api_check', S.aid, qid, pid, resp, meta).then(function (r) {
    fb.className = 'fb ' + r.status;
    fb.textContent = r.status === 'correct' ? '✓ Correct' : r.msg;

    if (r.status === 'correct') {

var EXT_SEEN = {}, EXT_PAT = /grammarly|chrome-extension|moz-extension|copilot|gemini|chatgpt|openai|monica|sider|merlin|maxai|harpa|photomath|mathway|socratic|quillbot|wordtune|brainly|gauth/i;

      h += '<div class="card list-item"><div class="grow"><b>' + esc(a.section) + ' ' + esc(a.title) + '</b><br><span class="muted">' + esc(st) + (a.due ? ' · Due ' + esc(a.due) : '') + '</span></div>' +
        (a.mode === 'test' ? '<span class="tag test">TEST</span>' : '<span class="tag">PRACTICE</span>') +
        '<button type="button" class="primary" onclick="openAssignment(\'' + esc(a.id) + '\')">' + (a.state === 'submitted' ? 'View' : 'Open') + '</button></div>';
    });
    v.innerHTML = h;
  }).catch(showError);
}

function profileForm(changing) {
  call('api_profile').then(function (p) {
    p = p || {};
    document.getElementById('view').innerHTML = '<div class="card" style="max-width:520px;margin:20px auto"><h2>' + (changing ? 'Change your name' : 'Welcome to Algebra Coach') + '</h2>' +
      '<p class="muted">Type your name the way it appears on your class list. Your teacher uses it to match your work.</p>' +
      '<label class="f" style="font-weight:600">First and last name</label><input type="text" id="pf_name" value="' + esc(p.name || '') + '" autocomplete="name">' +
      '<label class="f" style="font-weight:600;display:block;margin-top:10px">Class period</label><input type="text" id="pf_period" value="' + esc(p.period || '') + '" placeholder="e.g. 3">' +
      '<div class="row" style="margin-top:14px">' + (changing ? '<button type="button" onclick="loadHome()">Cancel</button>' : '') + '<button type="button" class="primary" onclick="saveProfile()">Continue</button></div>' +
      '<p class="muted" style="margin-top:12px">Use your own school device or account. Your work is saved in this browser until you send it.</p></div>';
  });
}
function saveProfile() {
  call('api_setProfile', document.getElementById('pf_name').value, document.getElementById('pf_period').value)
    .then(function () { loadHome(); if (START_AID) setTimeout(function () { openAssignment(START_AID); START_AID = ''; }, 200); })
    .catch(function (e) { toast(e.message || String(e)); });
}

function showLocked() {
  track(S.aid + '-locked', true);
  fsWanted = false; document.getElementById('fsCover').style.display = 'none';
  try { if (isFullscreen()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {}
  Tools.toggleCalc(false);
  var v = document.getElementById('view');
  v.innerHTML = '<div class="card center" style="max-width:560px;margin:20px auto"><div style="font-size:48px">🔒</div><h2>This test is locked</h2>' +
    '<p>The page was left ' + S.lockAfter + ' or more times. Your answers are saved.</p>' +
    '<p>Show your teacher this lock code:</p><div id="lockCode" style="font-size:34px;font-weight:700;letter-spacing:6px;color:var(--navy)">......</div>' +
    '<p style="margin-top:14px">Your teacher will give you an unlock code:</p>' +
    '<div class="row" style="justify-content:center"><input type="text" id="unlockIn" style="max-width:180px;text-align:center;font-size:22px;letter-spacing:4px;text-transform:uppercase" maxlength="8" autocomplete="off"><button type="button" class="primary" onclick="tryUnlock()">Unlock</button></div></div>';
  call('api_lockInfo', S.aid).then(function (i) { if (i) document.getElementById('lockCode').textContent = i.code; });
}
function checkUnlock() {}
function tryUnlock() {
  call('api_unlock', S.aid, document.getElementById('unlockIn').value).then(function (r) {
    if (r.ok) { toast('Unlocked. Opening the test.'); openAssignment(S.aid); } else toast('That code does not match. Check it with your teacher.');
  }).catch(function (e) { toast(e.message || String(e)); });
}

function showSubmitted(r) {
  Tools.toggleCalc(false);
  var v = document.getElementById('view'), h = '<div class="card center"><div style="font-size:44px">✅</div><h2>Submitted</h2>';
  if (r && r.score) {
    h += '<p class="big"><b>' + r.score.auto + ' / ' + r.score.max + '</b> points checked automatically</p>';
    if (r.score.writtenMax) h += '<p class="muted">Your teacher will grade the written answers (' + r.score.writtenMax + ' points).</p>';
  }
  h += '</div><div class="card" id="sendCard" style="border:2px solid var(--amber)"><h3>Send your work to your teacher</h3><p class="muted">Preparing your receipt…</p></div>';
  if (r && r.detail) {
    h += '<div class="card"><h3>How you did</h3><p class="muted">Review the ones marked ✗ with your notes or the answer key when your teacher releases it.</p>';
    S.A.questions.forEach(function (q) {
      var marks = q.parts.map(function (p) { var d = r.detail[key(q, p)]; return d === 'correct' ? '<span class="mark ok">✓</span>' : d === 'pending' ? '<span class="mark muted">✎</span>' : '<span class="mark no">✗</span>'; }).join('');
      h += '<div>' + esc(q.label) + '. ' + marks + '</div>';
    });
    h += '</div>';
  }
  h += '<div class="card center"><button type="button" onclick="goHome()">Back to assignments</button></div>';
  v.innerHTML = h;
  call('api_receipt', S.aid).then(renderSend).catch(function (e) {
    document.getElementById('sendCard').innerHTML = '<h3>Send your work to your teacher</h3><p class="err">Could not make the receipt: ' + esc(e.message || e) + '</p>';
  });
}
function formLink(rc) {
  var u = rc.formUrl; if (!u) return '';
  var vals = { NAME: rc.name + (rc.period ? ' (period ' + rc.period + ')' : ''), CODE1: rc.parts[0] || '', CODE2: rc.parts[1] || '', CODE3: rc.parts[2] || '' };
  return u.replace(/=(NAME|CODE1|CODE2|CODE3)(?=&|$|#)/g, function (m, k) { return '=' + encodeURIComponent(vals[k]); });
}
function renderSend(rc) {
  var box = document.getElementById('sendCard'); if (!box) return;
  window.__rc = rc;
  var link = formLink(rc), h = '<h3>Send your work to your teacher</h3>';
  if (link) {
    h += '<p><b>Step 1:</b> press the button. A form opens with your work already filled in.</p>' +
      '<p><button type="button" class="amber big" onclick="window.open(formLink(window.__rc), \'_blank\', \'noopener\')">Send to my teacher</button></p>' +
      '<p><b>Step 2:</b> on the form, press <b>Submit</b>. Your work is not turned in until you do.</p>';
  } else h += '<p>Copy each code below and turn it in the way your teacher asked.</p>';
  h += '<details' + (link ? '' : ' open') + ' style="margin-top:8px"><summary class="muted">If the form opens empty, copy the codes yourself</summary>' +
    '<p class="muted">Name: <b>' + esc(rc.name) + '</b>' + (rc.period ? ', period ' + esc(rc.period) : '') + '</p>' +
    rc.parts.map(function (p, i) {
      return '<div class="row" style="margin:6px 0"><b>Receipt code' + (i ? ' part ' + (i + 1) : '') + '</b><button type="button" class="small" onclick="copyPart(' + i + ')">Copy</button><span class="muted">' + p.length + ' characters</span></div>';
    }).join('') + '</details>' +
    (rc.tooLong ? '<p class="err">Your receipt is very long. Copy every part.</p>' : '') +
    '<p class="muted" style="margin-top:8px">You can come back to this assignment and press View to send it again.</p>';
  if (rc.redo) h += '<div style="margin-top:12px;padding-top:10px;border-top:1px dashed #c9d2e6"><b>Want to try it again?</b>' + (rc.attempt > 1 ? ' <span class="tag">Try ' + rc.attempt + '</span>' : '') +
    '<p class="muted">Redo clears your answers and starts this assignment over. Send this receipt first so your teacher has it.</p>' +
    '<button type="button" onclick="askRedo()">↺ Redo assignment</button></div>';
  box.innerHTML = h;
}
function copyPart(i) {
  var t = window.__rc.parts[i];
  var done = function () { toast('Copied part ' + (i + 1) + '. Paste it into the form.'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function () { fallbackCopy(t); done(); });
  else { fallbackCopy(t); done(); }
}
function fallbackCopy(t) {
  // The page blocks copy events for answers; this temporary box is allowed.
  var ta = document.createElement('textarea'); ta.setAttribute('data-ac', '1'); ta.value = t; document.body.appendChild(ta); ta.select();
  window.__allowCopy = true;
  try { document.execCommand('copy'); } catch (e) {}
  window.__allowCopy = false;
  ta.remove();
}

function askRedo() {
  modal('<h2>Redo this assignment?</h2><p>All of your answers, checks, hints, and work steps for this assignment will be cleared. You start over from question 1.</p>' +
    '<p><b>Did you send this receipt to your teacher?</b> If not, go back and press <b>Send to my teacher</b> first. Once you redo, this receipt is gone from the page.</p>' +
    '<div class="row"><button type="button" onclick="closeModal()">Go back</button><button type="button" class="primary" onclick="doRedo()">Yes, start over</button></div>');
}
function doRedo() {
  var aid = S.aid;
  call('api_redo', aid).then(function (r) {
    untrackOnce(aid); track(aid + '-redo', true);
    try { localStorage.removeItem(LOCAL + aid); } catch (e) {}
    closeModal(); toast('Starting over. This is try ' + r.attempt + '.', 3000);
    openAssignment(aid);
  }).catch(function (e) { closeModal(); toast(e.message || String(e)); });
}

Tools.init();
loadHome();
// Opened from a Classroom link (?a=assignment id): go straight to that assignment.
if (START_AID) call('api_profile').then(function (p) { if (p) setTimeout(function () { openAssignment(START_AID); START_AID = ''; }, 300); });
</script>
</body>
</html>
